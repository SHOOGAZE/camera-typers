<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DARKSLIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script>window.PIXI||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"><\/script>')</script>
</head>
<body>
<div id="fit"><div id="stage">

  <div id="vfw" class="t0">
    <canvas id="gl" width="420" height="874"></canvas>
    <div id="vfo">
      <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      <div id="split"></div>
    </div>
    <div id="bo"></div><div id="lk"></div>
    <div id="perm">Tap to allow camera</div>
  </div>
  <div id="scrimT"></div><div id="scrimB"></div>

  <div id="rew" class="slot t0"><i></i></div><div id="rewLab" class="lbl">Rew</div>
  <div id="latch" class="t0"></div><div id="latchLab" class="lbl">Back</div>
  <div id="counter" class="t0"><div id="ticks"></div><div class="drum"><div class="col"><div class="roll" id="d1"></div></div><div class="col"><div class="roll" id="d2"></div></div></div><span id="cntMax">/24</span></div>
  <div id="chip" class="t0"><i></i><span id="chipN"></span><em id="chipI"></em></div>

  <div id="tank" class="t0"></div>
  <div id="led"><span id="ledS">1/125</span><span id="ledA">F2.8</span><span id="ledE">EV 0.0</span><span id="ledN">01</span></div>
  <div id="rot">Поверните телефон<br>вертикально</div>
  <div id="lring"><div id="lnums"><div id="ltrack"></div></div><div id="lidx"></div></div>

  <div id="evs"><i></i></div><div id="evLab" class="lbl">EV</div>
  <div id="shutter"></div>
  <div id="lev" class="slot t0 led"><i></i></div>

  <div id="toast"></div>

  <div id="sheetBg"></div>
  <div id="sheet">
    <div class="grab"></div>
    <div class="sh-h" style="margin-top:4px">Film</div>
    <div id="ftabs"></div>
    <div id="fgrid"></div>
    <div class="sh-h">Frame</div>
    <div id="fseg"></div>
    <div class="sh-h">Effects</div>
    <div id="xseg" class="sg3"></div>
    <div class="sh-h">Border on print</div>
    <div id="bseg" class="sg3" style="grid-template-columns:repeat(4,1fr)"></div>
    <div class="sh-h">Development time</div>
    <div id="dseg" class="sg3" style="grid-template-columns:repeat(4,1fr)"></div>
    <div class="sh-h">Roll</div>
    <div id="seg"><b data-n="12">12</b><b data-n="24">24</b><b data-n="36">36</b></div>
    <div class="rowx"><span>Date back</span><div class="flag" id="swDate"><i class="a">ON</i><i class="b">OFF</i></div></div>
    <button id="bPhoto">Use a photo instead</button>
    <button class="sbtn" id="bPack">Sound pack · <span id="packN">synth</span></button><input type="file" id="packf" accept=".json" hidden>
  </div>

  <div id="lab">
    <div id="labHead"><span id="labTitle">DEVELOPING</span><span id="labSub"></span></div>
    <div id="labBar"><i id="labFill"></i></div>
    <div id="labScroll"><div id="labGrid"></div></div>
    <div class="prow"><button class="pbtn" id="labSave">SAVE ALL</button><button class="pbtn alt" id="labClose">DONE</button></div>
  </div>
  <div id="print">
    <div id="paper"><img id="pimg" alt="print"><div id="cap"><span id="capL"></span><span id="capR"></span></div></div>
    <div class="prow"><button class="pbtn" id="pSave">SAVE</button><button class="pbtn alt" id="pClose">BACK</button></div>
    <div id="phint">touch and hold the print to save it</div>
  </div>
  <canvas id="wear" width="780" height="1624"></canvas>
  <div id="nogl">Не удалось запустить рендер: нужен WebGL и загруженный PixiJS (проверь интернет).</div>
</div></div>
<video id="cam" autoplay playsinline webkit-playsinline muted></video>
<input type="file" id="file" accept="image/*" hidden>

<script>addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;top:40px;z-index:99;background:#300;color:#fdd;font:12px monospace;padding:8px;border-radius:6px;white-space:pre-wrap';d.textContent='ERR: '+e.message+' @'+(e.lineno||'');document.body.appendChild(d)});addEventListener('unhandledrejection',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;top:90px;z-index:99;background:#300;color:#fdd;font:12px monospace;padding:8px;border-radius:6px;white-space:pre-wrap';d.textContent='REJ: '+(e.reason&&e.reason.message||e.reason);document.body.appendChild(d)});</script>
<script src="presets.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
