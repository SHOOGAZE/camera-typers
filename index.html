<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DARKSLIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* DARKSLIDE — a black-paint 35mm SLR. The viewfinder is the whole screen; the camera is a few big,
   honest controls floating on it. Wear = black paint chipping off to brass, on the controls themselves. */
:root{
  --bg:#0b0b0a; --ink:#ebe5d6; --dim:rgba(235,229,214,.55); --hair:rgba(235,229,214,.16);
  --acc:#e4572e; --brass:#b98a4a;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--f-ui);color:var(--ink)}
#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:390px;height:812px;overflow:hidden;background:#000}
.t0{touch-action:none}

/* ---------- the viewfinder: whole screen ---------- */
#vfw{position:absolute;inset:0;z-index:1;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#vfo{position:absolute;left:0;top:50%;width:390px;height:585px;margin-top:-316.5px;pointer-events:none}
.cn{position:absolute;width:20px;height:20px;border:0 solid rgba(235,229,214,.7)}
.cn.tl{left:14px;top:14px;border-width:1.5px 0 0 1.5px}.cn.tr{right:14px;top:14px;border-width:1.5px 1.5px 0 0}
.cn.bl{left:14px;bottom:14px;border-width:0 0 1.5px 1.5px}.cn.br{right:14px;bottom:14px;border-width:0 1.5px 1.5px 0}
#split{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:1px solid rgba(235,229,214,.34)}
#split::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(235,229,214,.28)}
#split::after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px solid rgba(235,229,214,.16)}
#bo{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
#vfw.bo #bo{opacity:1;transition:none}
#lk{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,80,20,.97),rgba(255,190,110,.88) 45%,rgba(255,244,214,.96))}
#vfw.lk #lk{animation:lk 1.2s ease-out}
@keyframes lk{0%{opacity:1}100%{opacity:0}}
#perm{position:absolute;left:50%;top:50%;transform:translate(-50%,120px);padding:11px 18px;border-radius:999px;background:rgba(10,10,9,.7);border:1px solid var(--hair);
  color:var(--ink);font:600 13px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;display:none;z-index:3}
#scrimT{position:absolute;left:0;right:0;top:0;height:140px;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent)}
#scrimB{position:absolute;left:0;right:0;bottom:0;height:260px;z-index:2;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.5) 55%,transparent)}

/* ---------- top: rewind slide, back latch, frame drum, film ---------- */
.slot{position:absolute;border-radius:13px;background:#050505;box-shadow:inset 0 2px 4px #000,0 0 0 1.5px rgba(235,229,214,.16),0 6px 10px rgba(0,0,0,.55);touch-action:none;z-index:4}
.slot i{position:absolute;top:3px;left:3px;height:calc(100% - 6px);border-radius:10px;background:repeating-linear-gradient(90deg,#dedbd3 0 2px,#8d8a83 2px 4px);box-shadow:0 2px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.slot.led::before{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 8px #ff7a1a;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.lbl{position:absolute;z-index:4;font:600 11px var(--f-ui);letter-spacing:.28em;color:var(--dim);text-transform:uppercase;text-shadow:0 1px 5px rgba(0,0,0,.9);pointer-events:none}
#rew{left:20px;top:calc(var(--sat) + 24px);width:98px;height:26px}#rew i{width:38px}
#rewLab{left:22px;top:calc(var(--sat) + 55px);color:var(--acc)}
#latch{position:absolute;left:20px;top:calc(var(--sat) + 80px);width:44px;height:17px;border-radius:4px;z-index:4;touch-action:none;
  background:linear-gradient(180deg,#e8e5dd,#8b8982 55%,#d3d0c8);box-shadow:0 3px 5px rgba(0,0,0,.65),0 0 0 1px #050505;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
#latch::after{content:"";position:absolute;left:8px;right:8px;top:4px;bottom:4px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
#latch.open{transform:translateY(-7px);box-shadow:0 10px 8px rgba(0,0,0,.5),0 0 0 1.5px var(--acc)}
#latchLab{left:72px;top:calc(var(--sat) + 81px)}
#counter{position:absolute;left:50%;top:calc(var(--sat) + 16px);transform:translateX(-50%);z-index:4;text-align:center;touch-action:none}
.drum{width:88px;height:54px;border-radius:8px;background:#050505;box-shadow:inset 0 2px 6px #000,0 0 0 1.5px rgba(235,229,214,.16),0 6px 10px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;justify-content:center;gap:2px;padding:0 6px}
.drum .col{width:36px;height:100%;position:relative;overflow:hidden;background:linear-gradient(180deg,#000,#161614 50%,#000)}
.drum .roll{position:absolute;left:0;right:0;top:0}
.drum .roll b{display:block;height:54px;line-height:54px;text-align:center;font:500 38px var(--f-mono);color:#f2e9d0}
.drum::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent 32%,transparent 68%,rgba(0,0,0,.75));pointer-events:none}
#cntMax{display:block;margin-top:5px;font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.2em;text-shadow:0 1px 5px rgba(0,0,0,.9)}
#chip{position:absolute;right:20px;top:calc(var(--sat) + 26px);height:38px;padding:0 14px 0 12px;z-index:4;display:flex;align-items:center;gap:9px;border-radius:19px;
  background:rgba(8,8,7,.5);border:1px solid var(--hair);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font:600 17px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
#chip i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#chip em{font:500 12px var(--f-mono);font-style:normal;color:var(--dim);letter-spacing:.02em}

/* ---------- bottom: lens ring + shutter, exposure, lever ---------- */
#lring{position:absolute;left:18px;bottom:calc(var(--sab) + 108px);width:354px;height:38px;border-radius:19px;z-index:4;touch-action:none;
  background:rgba(8,8,7,.62);border:1px solid var(--hair);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 14px rgba(0,0,0,.5)}
#lnums{position:absolute;inset:0;overflow:hidden;border-radius:19px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
#ltrack{position:absolute;left:177px;top:0;width:0;height:100%}
.ln{position:absolute;top:0;width:72px;text-align:center;line-height:36px;font:600 21px var(--f-ui);color:var(--ink);letter-spacing:.02em}
.ln small{font:500 9px var(--f-mono);color:var(--dim);margin-left:2px}
.tkr{position:absolute;bottom:0;left:0;width:72px;height:6px;background:repeating-linear-gradient(90deg,rgba(235,229,214,.3) 0 1px,transparent 1px 9px);opacity:.8}
#lidx{position:absolute;left:50%;top:-1px;margin-left:-1px;width:2px;height:7px;background:var(--acc);z-index:3;box-shadow:0 0 6px rgba(228,87,46,.8)}

#shutter{position:absolute;left:50%;margin-left:-62px;bottom:calc(var(--sab) + 22px);width:124px;height:56px;border-radius:28px;z-index:4;touch-action:none;
  background:#101010;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.4px);background-size:5px 5px;
  box-shadow:inset 0 0 0 1.5px #2a2a28,inset 0 2px 0 rgba(255,255,255,.08),0 8px 14px rgba(0,0,0,.75);display:grid;place-items:center;transition:transform .06s}
#shutter::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3.5px rgba(235,229,214,.16)}
#shutter.dn{transform:scale(.95) translateY(1px)}
#lev{right:20px;bottom:calc(var(--sab) + 37px);width:116px;height:26px}#lev i{width:44px}
#evs{position:absolute;left:342px;top:calc(50% - 89px);width:28px;height:130px;border-radius:14px;z-index:4;touch-action:none;
  background:#050505;box-shadow:inset 0 2px 5px #000,0 0 0 1.5px rgba(235,229,214,.16),0 6px 10px rgba(0,0,0,.55)}
#evs i{position:absolute;left:2px;width:24px;height:18px;border-radius:5px;background:repeating-linear-gradient(0deg,#dedbd3 0 2px,#8d8a83 2px 4px);box-shadow:0 2px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5)}
#evs .tk{position:absolute;right:34px;width:9px;height:1px;background:rgba(235,229,214,.55)}
#evs .tk.z{width:16px;background:var(--ink)}
#evLab{left:325px;top:calc(50% - 108px);font-size:10px;letter-spacing:.2em}
#toast{position:absolute;left:0;right:0;top:calc(50% - 286px);text-align:center;font:600 14px var(--f-ui);letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 1px 8px rgba(0,0,0,.9);opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}

/* ---------- film sheet ---------- */
#sheetBg{position:absolute;inset:0;z-index:14;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:10px 18px calc(var(--sab) + 22px);border-radius:22px 22px 0 0;background:#121211;
  border-top:1px solid var(--hair);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 40px rgba(0,0,0,.6)}
#sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 14px}
.sh-h{font:600 12px var(--f-ui);letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin:14px 2px 9px}
#fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.carton{position:relative;height:96px;min-width:0;border-radius:7px;overflow:hidden;background:#1b1b19;border:1px solid var(--hair);cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.carton .cb{height:26px;display:flex;align-items:center;justify-content:center;font:700 16px var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.carton .ci{font:500 28px/1 var(--f-mono);margin:11px 0 0 12px}
.carton .ct{font:500 12px var(--f-ui);white-space:nowrap;letter-spacing:.08em;color:var(--dim);margin:5px 0 0 12px;text-transform:uppercase}
.carton.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.carton:active{transform:scale(.97)}
#seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
#seg b{padding:12px 0;text-align:center;font:500 18px var(--f-mono);color:var(--dim);cursor:pointer}
#seg b+b{border-left:1px solid var(--hair)}
#seg b.on{background:var(--ink);color:#141413}
#seg.lock b{opacity:.4}
.rowx{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:600 15px var(--f-ui);letter-spacing:.18em;text-transform:uppercase}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#050505;box-shadow:inset 0 2px 4px #000,0 0 0 1px var(--hair);cursor:pointer}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;transition:left .14s cubic-bezier(.3,1.4,.5,1);
  background:conic-gradient(from 30deg,#dcd9d1,#85837c,#ece9e1,#76746e,#dcd9d1);box-shadow:0 2px 3px rgba(0,0,0,.7)}
.sw.on{background:#2a1608}.sw.on i{left:25px}
.sw.on::after{content:"";position:absolute;left:11px;top:12px;width:6px;height:6px;border-radius:50%;background:#ff9a3d;box-shadow:0 0 8px #ff7a1a}
.flag{width:70px;height:40px;border-radius:5px;background:#050505;box-shadow:inset 0 2px 4px #000,0 0 0 1.5px rgba(235,229,214,.16);overflow:hidden;position:relative;cursor:pointer}
.flag i{position:absolute;inset:0;transition:transform .25s cubic-bezier(.3,1.4,.5,1);display:grid;place-items:center;font:700 15px var(--f-ui);letter-spacing:.14em}
.flag .a{background:#e4572e;color:#fff}.flag .b{background:#e8e4da;color:#141413;transform:translateY(100%)}
.flag.off .a{transform:translateY(-100%)}.flag.off .b{transform:none}
.sbtn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:10px;border:1px solid var(--hair);background:transparent;color:var(--ink);font:600 14px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;cursor:pointer}
#bPhoto{display:block;width:100%;margin-top:18px;padding:13px;border-radius:10px;border:1px solid var(--hair);background:transparent;color:var(--ink);
  font:600 14px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;cursor:pointer}

/* ---------- lab (developing) ---------- */
#lab{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--bg);padding:calc(var(--sat) + 24px) 14px calc(var(--sab) + 16px);gap:12px}
#lab.on{display:flex}
#labHead{display:flex;justify-content:space-between;align-items:baseline;font:600 20px var(--f-ui);letter-spacing:.34em}
#labSub{font:500 12px var(--f-mono);letter-spacing:.1em;color:var(--dim)}
#labBar{height:2px;background:#222;overflow:hidden;flex:none}
#labFill{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#labScroll{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#labGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 2px 12px}
#labGrid figure{margin:0;background:#ece6d6;padding:7px 7px 24px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.6);animation:emerge 3s ease-out;cursor:pointer}
#labGrid figure img{display:block;width:100%;height:auto}
#labGrid figcaption{position:absolute;left:8px;right:8px;bottom:6px;font:500 9px var(--f-mono);letter-spacing:.06em;color:#6b6558;text-transform:uppercase;display:flex;justify-content:space-between}
@keyframes emerge{from{filter:brightness(2.4) contrast(.3) saturate(.1) sepia(.5);opacity:.15}to{filter:none;opacity:1}}
.prow{display:flex;gap:12px;justify-content:center;flex:none}
.pbtn{font:600 15px var(--f-ui);letter-spacing:.26em;padding:13px 26px;border-radius:999px;border:1px solid var(--ink);color:#141413;cursor:pointer;background:var(--ink)}
.pbtn.alt{background:transparent;color:var(--ink);border-color:var(--hair)}
#print{position:absolute;inset:0;z-index:25;display:none;background:rgba(6,6,6,.92);align-items:center;justify-content:center;flex-direction:column;gap:20px}
#print.on{display:flex}
#paper{position:relative;background:#ece6d6;padding:12px 12px 40px;box-shadow:0 16px 40px rgba(0,0,0,.75);transform:rotate(-1deg)}
#paper img{display:block;max-width:310px;max-height:520px;width:auto;height:auto}
#cap{position:absolute;left:14px;right:14px;bottom:12px;font:500 10px var(--f-mono);letter-spacing:.06em;color:#6b6558;text-transform:uppercase;display:flex;justify-content:space-between}
#phint{font:500 12px var(--f-ui);letter-spacing:.22em;color:#777;text-transform:uppercase}
#wear{position:absolute;left:0;top:0;width:390px;height:812px;z-index:8;pointer-events:none}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:30;color:#ddd;text-align:center;padding:40px;background:#111;font:500 16px var(--f-ui)}
#cam{position:fixed;width:64px;height:64px;opacity:.02;z-index:0;pointer-events:none;left:0;top:0}
/* ---------- landscape: stage is wider than tall, controls move to the sides ---------- */
body.land #scrimT{height:100px}body.land #scrimB{height:130px}
body.land #perm{transform:translate(-50%,70px)}
body.land #rew{left:calc(var(--sal) + 22px);top:20px}
body.land #rewLab{left:calc(var(--sal) + 24px);top:51px}
body.land #latch{left:calc(var(--sal) + 22px);top:78px}
body.land #latchLab{left:calc(var(--sal) + 74px);top:79px}
body.land #counter{top:12px}
body.land #chip{right:calc(var(--sar) + 22px);top:20px}
body.land #evs{left:calc(var(--sal) + 30px);top:calc(50% - 50px)}
body.land #evLab{left:calc(var(--sal) + 33px);top:calc(50% - 70px)}
body.land #lring{left:50%;margin-left:-177px;bottom:16px}
body.land #shutter{left:auto;margin-left:0;right:calc(var(--sar) + 26px);bottom:auto;top:calc(50% - 40px)}
body.land #lev{right:calc(var(--sar) + 30px);bottom:26px}
body.land #sheet{left:50%;right:auto;width:560px;margin-left:-280px}
body.land #lab{padding-left:max(14px,var(--sal));padding-right:max(14px,var(--sar))}
#fseg,.sg3{display:grid;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.sg3{grid-template-columns:repeat(3,1fr)}
.sg3 b{padding:12px 0;text-align:center;font:600 14px var(--f-ui);letter-spacing:.16em;color:var(--dim);cursor:pointer}
.sg3 b+b{border-left:1px solid var(--hair)}.sg3 b.on{background:var(--ink);color:#141413}
@keyframes hint{50%{filter:drop-shadow(0 0 7px var(--acc))}}
.slot.hint{animation:hint .5s 3}
#sheet{max-height:94%;overflow-y:auto}
#ftabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
#ftabs b{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--hair);font:600 14px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);cursor:pointer}
#ftabs b.on{background:var(--ink);color:#141413;border-color:var(--ink)}
#fgrid{max-height:290px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:2px}
#fseg{grid-template-columns:repeat(5,1fr)}
#fseg b{font-size:14px;padding:9px 0 7px;line-height:1.15}#fseg b small{display:block;font:400 9px var(--f-mono);opacity:.7;margin-top:2px}
#fseg{display:grid;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
#fseg b{text-align:center;font-family:var(--f-ui);font-weight:600;color:var(--dim);cursor:pointer;letter-spacing:.06em}
#fseg b+b{border-left:1px solid var(--hair)}
#fseg b.on{background:var(--ink);color:#141413}
#fseg.lock b{opacity:1}

/* ---------- v5: viewfinder HUD ---------- */
#scrimT{height:120px}
#counter{left:auto;right:20px;top:calc(var(--sat) + 30px);transform:none;text-align:right}
.drum{display:none}
#ticks{display:flex;gap:3px;justify-content:flex-end}#ticks.dense{gap:2px}
#ticks i{width:4px;height:14px;background:rgba(235,229,214,.22)}#ticks.dense i{width:3px}
#ticks i.on{background:var(--ink)}#ticks i.cur{background:var(--acc)}
#cntMax{margin-top:7px}
#chip{left:20px;right:auto;top:calc(var(--sat) + 26px);height:auto;padding:0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:15px}
#chip em{font-size:12px}
#latch{top:calc(var(--sat) + 66px)}#latchLab{top:calc(var(--sat) + 67px)}
#rew{left:24px;top:auto;bottom:calc(var(--sab) + 50px)}
#rewLab{left:26px;top:auto;bottom:calc(var(--sab) + 28px)}
#lev{right:24px;bottom:calc(var(--sab) + 50px)}
#lring{bottom:calc(var(--sab) + 114px)}
#shutter{margin-left:-40px;width:80px;height:80px;border-radius:50%;bottom:calc(var(--sab) + 22px);background:radial-gradient(circle at 50% 35%,#f6f1e4,#bdb6a3 70%);background-size:auto;box-shadow:0 0 0 5px rgba(235,229,214,.14),0 0 0 6px #0b0a09,0 10px 20px rgba(0,0,0,.6)}
#shutter::before{display:none}
#evs{background:none;box-shadow:none}
#evs::before{content:"";position:absolute;left:13px;top:12px;bottom:12px;width:2px;background:linear-gradient(180deg,#e4572e,rgba(235,229,214,.9) 22% 78%,#6a8fe0)}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ================= state ================= */
const KEY='latent.v4';
const S=Object.assign({dev:1,fx:1,brd:0,fmt:0,cat:'all',lens:1,film:0,ev:0,date:true,len:24,frame:0,shots:0,opened:false,burnNext:0},(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}})());

const FOFF=24; /* the frame sits this far above screen centre, leaving room for the lens strip */
let FA=2/3,LAND=false,SW=390,DEV=false; /* 35mm frame: w/h (portrait <1, landscape >1) */
const faOf=(i,l)=>l?1/FORMATS[i].asp:FORMATS[i].asp;
const wearOf=n=>1-Math.exp(-n/90);
const BURN=[0,.3,.65,1];

/* ================= data ================= */
const LENSES=[
 {mm:28, name:'DS-WIDE 1:3.5', zoom:1.22,k:.20, vig:.55,ca:.40,soft:.35,swirl:0, glow:.10},
 {mm:55, name:'DS-SOL 1:1.8',  zoom:1.60,k:.02, vig:.38,ca:.15,soft:.20,swirl:0, glow:.15},
 {mm:58, name:'ROSSA-ZAR 1:2',     zoom:1.70,k:0,   vig:.50,ca:.20,soft:.95,swirl:1, glow:.25},
 {mm:85, name:'SOFT-DS 1:2.8',    zoom:2.10,k:-.03,vig:.30,ca:.10,soft:.25,swirl:0, glow:.95},
 {mm:135,name:'TELE-DS 1:3.5',    zoom:2.60,k:-.05,vig:.25,ca:.25,soft:.10,swirl:0, glow:.10},
];
const FB={contrast:1,lift:.02,sat:1,sh:[0,0,0],hi:[0,0,0],grain:.05,gres:900,hal:.2,glow:.12,roll:1.3,fog:0,fogC:[.03,.03,.03],mono:0,mw:[.34,.5,.16],leak:.02,dust:.03,dark:0,halo:[1,.4,.2],gn:[1,1,1],gm:[1,1,1],vigx:0};
const mk=(name,iso,type,cat,c,ink,o)=>Object.assign({name,iso,type,cat,c,ink},FB,o);
const FILMS=[
 mk('CPM35',200,'90s compact, honey','colour','#d99a3a','#2a1a04',{preset:'CPM35'}),
 mk('FXN-R',400,'japanese film','colour','#3f8a6a','#eafff2',{preset:'FXN_R'}),
 mk('CCD-04',100,'early digicam','colour','#5a5ac8','#eeeeff',{preset:'CCD_2004'}),
 mk('800T',800,'night cine, red halation','cine','#2a76a0','#fff3e2',{preset:'CINESTILL_800T'}),
 mk('DAY',200,'your scans, daylight','mine','#e0a37c','#2a1408',{preset:'MINE_DAY'}),
 mk('NIGHT',800,'your scans, stage light','mine','#7a2bc4','#f4e8ff',{preset:'MINE_NIGHT'}),

];

const FORMATS=[
 {n:'FULL',s:'36\u00d724',asp:2/3,crop:1},

 {n:'6\u00d77',s:'4:5',asp:4/5,crop:1},
 {n:'SQUARE',s:'6\u00d76',asp:1,crop:1},
];

/* ================= sound engine v2: modal / contact synthesis =================
   A click is not a beep: it is a tiny impact (a 1–2 ms noise transient) exciting a few damped resonances
   (metal rings high and long, plastic low and dull, the camera body adds a short room). Every play is
   slightly randomised, so ten shots never sound like one sample. Your own recordings override any sound. */
let AC,NB,MASTER;
const rnd=a=>(Math.random()*2-1)*a, J=(x,p=.03)=>x*(1+rnd(p));
function ac(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const sr=AC.sampleRate;NB=AC.createBuffer(1,sr,sr);const d=NB.getChannelData(0);for(let i=0;i<sr;i++)d[i]=Math.random()*2-1;
  MASTER=AC.createGain();MASTER.gain.value=.55;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=70;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=3;comp.attack.value=.001;comp.release.value=.08;
  const conv=AC.createConvolver(),L=Math.floor(sr*.16),ir=AC.createBuffer(1,L,sr),o=ir.getChannelData(0);
  for(let i=0;i<L;i++){const t=i/sr;o[i]=(Math.random()*2-1)*Math.exp(-t/.024)*Math.min(1,i/30)}
  for(const[tm,g]of[[.0023,.5],[.0051,.35],[.0089,.25]]){const k=Math.floor(tm*sr);o[k]+=g;o[k+1]-=g*.6}
  const wet=AC.createGain();wet.gain.value=.2;MASTER.connect(hp);MASTER.connect(conv);conv.connect(wet);wet.connect(hp);hp.connect(comp);comp.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
const T0=()=>AC.currentTime;
/* noise band: friction, swish of a curtain, rustle */
function nz(t,o){o=Object.assign({f:3000,q:1,type:'bandpass',dur:.01,g:.3,att:.0008,f2:0},o);
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const b=AC.createBiquadFilter();b.type=o.type;const T=T0()+Math.max(0,t);b.frequency.setValueAtTime(o.f,T);if(o.f2)b.frequency.exponentialRampToValueAtTime(o.f2,T+o.dur);b.Q.value=o.q;
  const v=AC.createGain();v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime(o.g,T+o.att);v.gain.exponentialRampToValueAtTime(.0001,T+o.dur);
  s.connect(b);b.connect(v);v.connect(MASTER);s.start(T,Math.random());s.stop(T+o.dur+.03)}
const tick=(t,f,g,d=.003)=>nz(t,{f,q:.7,type:'highpass',dur:d,g,att:.0002});
/* damped sinusoid: one resonance of a struck object */
function ping(t,f,dec,g,f2){if(f>AC.sampleRate*.45)return;const T=T0()+Math.max(0,t),o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+dec*2);
  v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime(g,T+.0004);v.gain.setTargetAtTime(0,T+.0004,dec);o.connect(v);v.connect(MASTER);o.start(T);o.stop(T+dec*8+.02)}
/* low body thump */
const thud=(t,f,g,dec)=>ping(t,f,dec,g,f*.55);
/* metal ring: inharmonic partials, high ones die first */
function metal(t,f,g,dec){f=J(f,.04);[[1,1,1],[2.76,.55,.7],[5.4,.32,.45],[8.93,.18,.3]].forEach(([r,gg,dd])=>ping(t,f*r,dec*dd,g*gg))}
/* plastic knock: lower, duller, shorter */
function plast(t,f,g,dec){f=J(f,.05);[[1,1,1],[1.93,.5,.6],[3.1,.25,.35]].forEach(([r,gg,dd])=>ping(t,f*r,dec*dd,g*gg))}
/* the basic contact click every mechanism is made of */
function click(t,v=1,pitch=1){tick(t,J(5200,.1),.3*v,.0025);metal(t,2500*pitch,.2*v,.011);thud(t,J(200,.1),.22*v,.016)}
/* motor: two detuned saws through a lowpass, pitch wobble and gear grit */
function motor(t,dur,f0,f1,g,cut=1300){const T=T0()+t,lp=AC.createBiquadFilter(),v=AC.createGain(),lf=AC.createOscillator(),lg=AC.createGain();
  lp.type='lowpass';lp.frequency.value=cut;lp.Q.value=2.5;v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime(g,T+.05);v.gain.setValueAtTime(g,T+dur-.06);v.gain.linearRampToValueAtTime(0,T+dur);
  lf.frequency.value=6+Math.random()*3;lg.gain.value=f0*.02;lf.connect(lg);
  [1,1.007].forEach(m=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*m,T);o.frequency.linearRampToValueAtTime(f1*m,T+dur);lg.connect(o.frequency);o.connect(lp)});
  lp.connect(v);v.connect(MASTER);lf.start(T);lf.stop(T+dur+.05);
  nz(t,{f:cut*1.2,q:.7,dur:dur,g:g*.55,att:.05});}
/* run a motor to its stop: spin-down + clunk */
const stopClunk=(t,v=1)=>{thud(t,J(150,.05),.5*v,.05);metal(t,1800,.25*v,.02);tick(t,3500,.25*v,.003)};

   tick(.075,3200,.55);metal(.075,1700,.35,.03);thud(.075,J(118,.05),.5,.05);nz(.075,{f:2500,q:.7,dur:.02,g:.3});
   thud(.23,J(88,.04),.85,.11);nz(.23,{f:700,q:.6,dur:.06,g:.4});tick(.23,2200,.3);thud(.262,J(105,.08),.3,.05);tick(.262,2600,.12)}},

   SND.shutter[0].fn();motor(.15,.17,95,210,.11,1500);stopClunk(.33,.7)}},

   nz(.044,{f:5200,q:1.1,dur:.006,g:.34});tick(.044,6500,.25);
   nz(.3,{f:4300,q:1,dur:.008,g:.3});metal(.304,2800,.18,.012);thud(.304,J(140,.05),.28,.02);

/* ================= FilmEngine: 5 FBO passes (optics -> colour+LUT -> bright/blur -> bloom/halation/grain -> overlays) ================= */
/* =====================================================================
   FILM ENGINE — WebGL2 / GLSL ES 3.0
   Pass 1  Optics        : distortion, lateral CA, optical softness / sharpen
   Pass 2  Color science : WB, crosstalk, filmic curve + roll-off, fade, split-tone, Hald LUT
   Pass 3  Bright + blur : soft-knee bright pass (1/2) -> separable gauss (1/4) -> (1/8)
   Pass 4  Composite     : bloom, halation, cos^4 vignette, luminance-dependent grain
   Pass 5  Overlays      : light leak, dust/scratches, 7-segment LED date, develop, dither
   ===================================================================== */

const GLSL_VERT = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  vUv = p; gl_Position = vec4(p*2.-1., 0., 1.);
}`;

const GLSL_COMMON = `#version 300 es
precision highp float; precision highp int;
in vec2 vUv; out vec4 o;
uniform float uEnc;
vec3 toLin(vec3 c){ return mix(c/12.92, pow((c+.055)/1.055, vec3(2.4)), step(.04045, c)); }
vec3 toSRGB(vec3 c){ c=max(c,0.); return mix(c*12.92, 1.055*pow(c, vec3(1./2.4))-.055, step(.0031308, c)); }
vec3 rd(vec3 c){ return uEnc>.5 ? toLin(c) : c; }
vec3 wr(vec3 c){ return uEnc>.5 ? toSRGB(c) : c; }
float luma(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float gnoise(vec2 p, float seed){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  vec2 s=vec2(seed*37.1, seed*17.3);
  float a=hash12(i+s), b=hash12(i+vec2(1.,0.)+s), c=hash12(i+vec2(0.,1.)+s), d=hash12(i+vec2(1.)+s);
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
`;

/* ---------- Pass 1: optics ---------- */
const FS_OPTICS = GLSL_COMMON + `
uniform sampler2D uSrc;
uniform float uSrcA, uOutA, uK, uCA, uSoft, uSharp, uSc, uShift, uZoom;
uniform vec2 uPx, uView;
float lin1(float c){ return c<=.04045 ? c/12.92 : pow((c+.055)/1.055, 2.4); }
vec2 cover(vec2 uv){
  float ra = uOutA/uSrcA;
  vec2 s = ra>1. ? vec2(1., 1./ra) : vec2(ra, 1.);
  return (uv-.5)*s + .5;
}
void main(){
  vec2 fuv = (vUv-.5-vec2(0.,uShift))*uView+.5;           // frame space: the screen may show more than the 35mm frame
  vec2 p = fuv-.5;
  vec2 pn = p*vec2(uOutA,1.)*2./sqrt(uOutA*uOutA+1.);     // corner radius = 1
  float r2 = dot(pn,pn);
  float zoom = (1.+max(uK,0.))*(1.+uCA)*uZoom;                  // no black borders
  float rad = (.8 + 2.4*uSoft*r2)*uSc;                    // micro-blur radius grows to corners
  vec2 off = uPx*rad*uView;                               // canvas px -> frame uv, isotropic
  vec3 cen, rin;
  for(int c=0;c<3;c++){
    float s = 1. + uCA*r2*(c==0 ? 1. : (c==2 ? -1. : 0.));  // R pushed out, B pulled in
    vec2 b = p*(1.+uK*r2)*s/zoom;
    cen[c] = lin1(texture(uSrc, cover(.5+b))[c]);
    float t = lin1(texture(uSrc, cover(.5+b+vec2( off.x,0.)))[c])
            + lin1(texture(uSrc, cover(.5+b+vec2(-off.x,0.)))[c])
            + lin1(texture(uSrc, cover(.5+b+vec2(0., off.y)))[c])
            + lin1(texture(uSrc, cover(.5+b+vec2(0.,-off.y)))[c]);
    rin[c] = t*.25;
  }
  vec3 blur = cen*.36 + rin*.64;                          // 5-tap
  float w = clamp(uSoft*(.25+1.1*r2), 0., 1.);
  vec3 col = mix(cen, blur, w);
  col += (cen-blur)*uSharp*1.5*(1.-.5*w);                 // unsharp (CCD / flash micro-contrast)
  col = clamp(col, vec3(0.), vec3(8.));                   // no negatives / inf into the half-float chain
  o = vec4(wr(col), 1.);
}`;

/* ---------- Pass 2: color science ---------- */
const FS_COLOR = GLSL_COMMON + `
uniform sampler2D uImg, uLut;
uniform float uExp, uTemp, uTint, uContrast, uSat, uKnee, uWhite, uHiDes, uFade, uLutMix, uUseLut, uFlash;
uniform float uCube, uLevel, uLutSize;
uniform mat3 uXT;
uniform vec3 uShTone, uHiTone, uGm, uGn, uMonoW;
uniform float uMono;
vec3 lutFetch(float rf, float g, float b){
  float gx = mod(g, uLevel), gy = floor(g/uLevel);
  vec2 px = vec2(gx*uCube + rf + .5, gy + b*uLevel + .5);
  return texture(uLut, px/uLutSize).rgb;
}
vec3 lutLookup(vec3 c){                                   // Hald CLUT, trilinear (hw-linear in R, manual in G,B)
  c = clamp(c, 0., 1.);
  vec3 f = c*(uCube-1.);
  vec3 i0 = floor(f); vec3 t = f-i0;
  vec3 i1 = min(i0+1., uCube-1.);
  vec3 c00 = mix(lutFetch(f.r,i0.g,i0.b), lutFetch(f.r,i1.g,i0.b), t.g);
  vec3 c01 = mix(lutFetch(f.r,i0.g,i1.b), lutFetch(f.r,i1.g,i1.b), t.g);
  return mix(c00, c01, t.b);
}
void main(){
  vec3 c = rd(texture(uImg, vUv).rgb);
  c *= vec3(1.+.22*uTemp, 1., 1.-.22*uTemp);
  c *= vec3(1.+.08*uTint, 1.-.12*uTint, 1.+.08*uTint);
  c *= exp2(uExp);
  c = clamp(uXT*c, vec3(0.), vec3(32.));                  // channel crosstalk, finite

  float L = luma(c);
  c = mix(vec3(L), c, uSat);
  c = .18*pow(max(c,0.)/.18, vec3(uContrast*(1.+.25*uFlash)));   // S-curve around middle grey
  float Lc = luma(c);
  float k = uKnee, W = uWhite;
  vec3 hi = k + (W-k)*(1.-exp(-(c-k)/(W-k)));             // C1 shoulder: highlight roll-off
  c = mix(c, hi, step(k, c));
  c = max(c, vec3(1e-5));
  float td = smoothstep(k*.8, k*2.2, Lc)*uHiDes;          // highlights lose saturation
  c = mix(c, vec3(luma(c)), td);
  vec3 s = toSRGB(c);
  s = uFade + s*(1.-uFade);                               // black point lift
  s = pow(max(s,0.), uGm)*uGn;                            // per-channel gamma / gain (emulsion balance)
  s = mix(s, vec3(dot(s,uMonoW)), uMono);                 // panchromatic B&W response
  float ls = luma(s);
  s += uShTone*(1.-smoothstep(0., .55, ls)) + uHiTone*smoothstep(.45, 1., ls);   // split toning
  if(uUseLut>.5) s = mix(s, lutLookup(s), uLutMix);
  o = vec4(wr(toLin(clamp(s,0.,1.))), 1.);
}`;

/* ---------- Pass 3: bright-pass + gaussian ---------- */
const FS_BRIGHT = GLSL_COMMON + `
uniform sampler2D uImg; uniform vec2 uPx; uniform float uThr, uKneeB;
void main(){
  vec3 c = rd(texture(uImg, vUv+uPx*vec2(-1.,-1.)).rgb) + rd(texture(uImg, vUv+uPx*vec2(1.,-1.)).rgb)
         + rd(texture(uImg, vUv+uPx*vec2(-1.,1.)).rgb)  + rd(texture(uImg, vUv+uPx*vec2(1.,1.)).rgb);
  c = clamp(c*.25, vec3(0.), vec3(16.));
  float br = max(c.r, max(c.g, c.b));
  float soft = clamp(br-uThr+uKneeB, 0., 2.*uKneeB);
  soft = soft*soft/(4.*uKneeB+1e-5);
  float con = max(soft, br-uThr)/max(br, 1e-5);
  o = vec4(wr(c*con), 1.);
}`;
const FS_BLUR = GLSL_COMMON + `
uniform sampler2D uImg; uniform vec2 uDir;

/* ============================ STAMP LAYOUT ============================ */
function stampLayout(P, now = new Date()){
  const y = P.stampYear || now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const p2 = (n) => String(n).padStart(2, '0');
  let seq = [];
  if(P.stampFmt === 0){ const s = p2(y%100)+' '+p2(m)+' '+p2(d); seq = ["'", ...s.split('')]; }
  else { const s = String(y).padStart(4,'0')+'.'+p2(m)+'.'+p2(d); seq = s.split(''); }
  const glyphs = [], xs = []; let x = 0;
  for(const ch of seq){
    if(ch === ' '){ x += .7; continue; }
    if(ch === "'"){ glyphs.push(10); xs.push(x); x += .55; continue; }
    if(ch === '.'){ glyphs.push(11); xs.push(x); x += .6; continue; }
    glyphs.push(+ch); xs.push(x); x += 1.3;
  }
  return { on:true, glyphs, xs, width:x };
}

    const blob=await new Promise(res=>withBorder(cv,fp,k,n).toBlob(res,'image/jpeg',.92));
    const it={i:k,blob,cap:{l:'No.'+String(k+1).padStart(2,'0')+' · '+LENSES[fp.lens].mm+'mm',r:fp.burn>0?'light-struck':FILMS[fi(fp)].name+' '+FILMS[fi(fp)].iso}};
    out.push(it);addFig(it);$('#labFill').style.width=Math.round((k+1)/n*100)+'%';$('#labSub').textContent=(k+1)+' / '+n;await sleep(60);
    $('#labScroll').scrollTop=1e5}
  DEV=false;FA=faOf(S.fmt,LAND);cv.width=pw;cv.height=ph;freeRT();makeStamp(Date.now());recalcCover();if(!live&&SCENE.el)uploadSrc(SCENE.el,SCENE.w,SCENE.h);dirty=true;
  await clr('dev');for(const it of out)await put('dev',it);
  if(tank){await tdel(tank.id);const x=TK.findIndex(t=>t.id===tank.id);if(x>=0)TK.splice(x,1);tankTick()}
  else{await clr('raw');S.frame=0;S.opened=false;S.burnNext=0;armed=true;levRest()}
  FA=faOf(S.fmt,LAND);sync(true);
  $('#labTitle').textContent='DEVELOPED';$('#labSave').style.display='';$('#labClose').style.display=''}
$('#labClose').addEventListener('click',()=>{labOpen=false;$('#lab').classList.remove('on');labItems.forEach(x=>URL.revokeObjectURL(x.u));labItems=[]});
$('#labSave').addEventListener('click',()=>saveBlobs(labItems.map(x=>x.it.blob),labItems.map((x,i)=>'darkslide-'+String(i+1).padStart(2,'0')+'.jpg')));
let curIt=null;
function showPrint(u,it){curIt=it;$('#pimg').src=u;$('#capL').textContent=it.cap.l;$('#capR').textContent=it.cap.r;$('#print').classList.add('on')}
$('#pClose').addEventListener('click',()=>$('#print').classList.remove('on'));
$('#pSave').addEventListener('click',()=>{if(curIt)saveBlobs([curIt.blob],['darkslide-'+String(curIt.i+1).padStart(2,'0')+'.jpg'])});
/* last developed roll: long-press the film chip */
let kp=null;$('#chip').addEventListener('pointerdown',()=>{kp=setTimeout(async()=>{longChip=true;sheet(false);if(backOpen||S.frame>0)return;const d=await all('dev');if(!d.length){toast('No developed roll yet');return}showLab(d.sort((a,b)=>a.i-b.i),false)},650)});
['pointerup','pointercancel'].forEach(n=>$('#chip').addEventListener(n,()=>clearTimeout(kp)));

/* ---- preview loop ---- */
let lastT=0;
function loop(t){requestAnimationFrame(loop);
  if(labOpen&&!$('#lab').classList.contains('on'))labOpen=false;
  if(labOpen)return;
  if(live&&vid.readyState>=2&&vid.videoWidth){if(t-lastT<30)return;lastT=t;uploadSrc(vid,vid.videoWidth,vid.videoHeight);dirty=true}
  if(dirty){renderFilm(previewFp(),6);dirty=false}}

/* ---- fit: full-bleed. The stage is 390 wide and as tall as the screen needs ---- */
function fit(){const f=$('#fit'),w=f.clientWidth,h=f.clientHeight,wasL=LAND;
  LAND=false;
  if(LAND){SC=Math.min(h/390,1.8);SH=390;SW=Math.max(390,Math.round(w/SC))}
  else{SC=Math.min(w/390,1.6,h/700);SH=Math.max(700,Math.round(h/SC));SW=390}
  document.body.classList.toggle('land',LAND);
  const st=$('#stage');st.style.width=SW+'px';st.style.height=SH+'px';st.style.transform='scale('+SC+')';
  if(!labOpen){cv.width=Math.round(SW*420/390);cv.height=Math.round(SH*420/390);freeRT()}
  wc.width=SW*2;wc.height=SH*2;wc.style.width=SW+'px';wc.style.height=SH+'px';
  if(!DEV){FA=faOf(S.fmt,LAND);recalcCover();makeStamp(Date.now())}
  layoutFrame();wearDraw();dirty=true}
addEventListener('resize',fit);

/* ================= boot ================= */
(async()=>{
  makeBrushedNone();
  const d=demoScene();setScene(d,d.width,d.height);makeStamp(Date.now());
  try{sdb=await sopen();Object.assign(RAW,await sgetAll())}catch(e){sdb=null}packN();
  fit();setFormat(S.fmt||0);drawFilms();setLP(S.lens*72,false);sync(true);levRest(true);
  let raws=[];try{db=await idb();raws=await all('raw');for(const r of await tall())TK.push({id:r.id,ready:r.ready,n:r.items.length,film:r.film})}catch(e){db=null}tankTick();if(raws.length!==S.frame){S.frame=raws.length;sync(true)}
  requestAnimationFrame(loop);
  toast('Wind · shoot · rewind to develop');
  startCam();
})();
function makeBrushedNone(){}
window.__latent=window.__darkslide={S,renderFilm,previewFp,developRoll,fire,all,finishRoll,developTank,TK,tankTick,wind:()=>{armed=true;levRest()},openBack,sheet};
})();
</script>
